# ============================================================
# Regulatory Pipeline Scheduler Configuration
# ============================================================
# 
# This file controls when each regulator pipeline runs.
# Supports both direct execution and API-based triggering.
#
# Timezone: Set in .env file (default: Asia/Karachi)
# ============================================================

jobs:
  # --------------------------------------------------------
  # SBP Pipeline
  # --------------------------------------------------------
  sbp_pipeline:
    enabled: true
    trigger: cron
    schedule:
      # Run every day at 2:00 AM (Karachi time)
      hour: 2
      minute: 0
      # day_of_week: '*'  # Every day (default)
      # day_of_week: 'mon,wed,fri'  # Specific days
      # day_of_week: 'mon-fri'  # Weekdays only

  # --------------------------------------------------------
  # SECP Pipeline
  # --------------------------------------------------------
  secp_pipeline:
    enabled: true
    trigger: cron
    schedule:
      # Run every day at 3:00 AM (Karachi time)
      hour: 3
      minute: 0

  # --------------------------------------------------------
  # SAMA Pipeline
  # --------------------------------------------------------
  sama_pipeline:
    enabled: true
    trigger: cron
    schedule:
      # Run every day at 4:00 AM (Karachi time)
      hour: 10
      minute: 46

  # --------------------------------------------------------
  # CBB Monitoring
  # --------------------------------------------------------
  cbb_monitoring:
    enabled: true
    trigger: cron
    schedule:
      # Run every day at 5:00 AM (Karachi time)
      hour: 5
      minute: 0

  # --------------------------------------------------------
  # Full Pipeline (All Regulators)
  # --------------------------------------------------------
  # This is only available when using API mode
  # It triggers all regulators via a single API call
  full_pipeline:
    enabled: false  # Set to true if you want to use this instead
    trigger: cron
    schedule:
      # Run every day at 2:00 AM (Karachi time)
      hour: 2
      minute: 0

# ============================================================
# Schedule Examples
# ============================================================
#
# Daily at specific time:
#   hour: 14
#   minute: 30
#
# Weekdays only at 9 AM:
#   hour: 9
#   minute: 0
#   day_of_week: 'mon-fri'
#
# Specific days at 6 PM:
#   hour: 18
#   minute: 0
#   day_of_week: 'mon,wed,fri'
#
# Every 6 hours:
#   trigger: interval
#   schedule:
#     hours: 6
#
# Every Monday at 10 AM:
#   hour: 10
#   minute: 0
#   day_of_week: 'mon'
#
# Twice daily (8 AM and 8 PM):
#   Create two separate jobs with different hours
# ============================================================

  # ==========================================================
  # KSA MONITORING
  # ==========================================================
  # Grouped by what each regulator's site will actually answer, because that —
  # not the regulator's importance — decides how often and how expensively it
  # can be checked. The measurements behind each grouping are in
  # jobs/monitor_jobs.py and config/change_signals.yml.
  #
  # All four write STRAIGHT TO MSSQL and leave `status` EMPTY. "What arrived
  # overnight and nobody has judged" is `WHERE status = ''`; a person sets
  # active/reject through POST /update-status/regulations. Nothing here approves
  # its own output.
  #
  # DISABLED BY DEFAULT. Turning these on is a server decision, not a repo one.
  # ----------------------------------------------------------

  # MOE, MOH, SDAIA, AML, MHRSD, ZATCA — one request per stored document,
  # about a minute for all six. Crawls only what actually moved.
  monitor_cheap_probes:
    enabled: false
    trigger: cron
    schedule:
      hour: 3
      minute: 0

  # SAMA's own "what changed" page: ~3 seconds instead of 6,101 probes. This is
  # also the only signal that DISCOVERS documents missing from the library.
  monitor_sama:
    enabled: false
    trigger: cron
    schedule:
      hour: 3
      minute: 15

  # mc.gov.sa refuses plain HTTP clients, so no probe can answer and the crawl
  # IS the signal. ~16 minutes, so weekly rather than daily.
  monitor_mc:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 4
      minute: 0

  # CMA cannot be probed (its Last-Modified is the current time) and cannot be
  # confirmed at scale. Weekly, and the announcements tab MUST run as a recent
  # window — a full walk measured 2h49m and still returned 300 of the 1,053
  # announcements we hold, which would rule the other 753 `disappeared`.
  # CMA_SINCE_DAYS controls that window.
  monitor_cma:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 5
      minute: 0

  # CBE is twelve sources: the circulars API (one request, and it DISCOVERS —
  # a crawl of that pager reads 18 of 396) plus eleven browser crawls of the HTML
  # sections. Weekly because of the eleven, not the one.
  #
  # SUNDAY 06:00, an hour after CMA and two after MC, so the three weekly browser
  # crawls do not collide. That stagger is a convenience, not a guarantee — CMA
  # has measured 2h49m — and the real protection is the shared crawl lock in
  # jobs/monitor_jobs.py, which makes a colliding job SKIP rather than queue.
  #
  # cbe.org.eg runs bot protection: it refuses urllib outright and answers HEAD
  # with 403. Both hosts in change_signals.yml `skip_hosts` were blocked by
  # automated access from this address, and eleven prefix crawls is real
  # iteration. Weekly is part of staying welcome, not just a cost decision.
  #
  # NOT ENABLED, and not only because of the file-wide default: CBE has no
  # baseline in the library yet. Monitoring is a comparison, so until the
  # workbook has been exported, read and promoted, this job would be comparing
  # against nothing.
  monitor_cbe:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 6
      minute: 0

  # RERA (Bahrain) is small — 15 pages, 123 documents, server-rendered, no pager
  # and no WAF — so this is the cheapest of the weekly crawls. It is weekly rather
  # than daily because nothing about RERA moves fast: two circulars in all of 2025.
  #
  # It is a CRAWL rather than a probe even though its probe would work (117 of 121
  # stored urls carry a stable ETag). Circulars are partitioned by year, one page
  # per year, and a new year is a NEW PAGE — Circulars-issued-in-2026 is a 404
  # today. Only a crawl can find that.
  #
  # Sunday 07:00, after CBE, so the weekly browser crawls stay staggered. The
  # shared lock in jobs/monitor_jobs.py is the real protection if one overruns.
  #
  # NOT ENABLED: RERA has no baseline in the library yet, so this would compare
  # against nothing.
  monitor_rera:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 7
      minute: 0

  # SIO (Bahrain) — ten small crawls of sio.gov.bh, ~5 minutes for 214 documents.
  #
  # THE CRAWL IS THE SIGNAL BECAUSE NOTHING ELSE ANSWERS, not because a probe is
  # merely inconvenient: no ETag, no Last-Modified, no Content-Length on any page,
  # and a sitemap whose 106 lastmod values are all its own build time. Measured
  # 2026-08-25; the reasoning is in config/change_signals.yml.
  #
  # It is cheap because every law is a modal already in the page: a section's ~48
  # laws come from ONE page load. Sunday 08:00, after RERA at 07:00, so the weekly
  # browser crawls stay staggered — the shared lock in jobs/monitor_jobs.py is the
  # real protection if one overruns.
  #
  # NOT ENABLED: SIO has no baseline in the library yet, so this would compare
  # against nothing. Promote output/workbooks/sio.xlsx first (214 rows,
  # `check` verdict OK), then turn this on.
  monitor_sio:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 8
      minute: 0

  # PDPA (Bahrain) — the whole regulator is TWO page loads, because both its
  # sources are max_pages: 1. Weekly rather than daily only because a data
  # protection law and its ten executive decisions do not move often; the cost
  # would not argue against daily.
  #
  # 08:30 and not 08:00 so it does not start inside monitor_sio's window. Neither
  # touches the other's host, so this is tidiness, not a dependency.
  #
  # NOT ENABLED: PDPA has no baseline in the library yet, so this would compare
  # against nothing and every one of the 82 rows would read as new. Promote
  # output/workbooks/pdpa.xlsx first (82 rows, `check` verdict OK), then turn
  # this on.
  monitor_pdpa:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 8
      minute: 30

  # MOIC (Bahrain) — 11 page loads for 95 documents. Weekly rather than daily
  # because commercial law and ministerial orders do not move often; the cost
  # would not argue against daily.
  #
  # 09:00, after monitor_sio (08:00) and monitor_pdpa (08:30). Different hosts,
  # so this is tidiness rather than a dependency.
  #
  # NOT ENABLED: MOIC has no baseline in the library yet, so this would compare
  # against nothing and all 95 rows would read as new. Promote
  # output/workbooks/moic.xlsx first (95 rows, `check` verdict OK), then turn
  # this on.
  monitor_moic:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 9
      minute: 0

  # LLOC (Bahrain) — the `Latest Legislation` window ONLY: 144 records, 15
  # requests, about 40 seconds. monitor_lloc() narrows the config with
  # only_sources; the 1,583-document classification section is coverage and is
  # deliberately NOT on this path (it takes 47 minutes).
  #
  # DAILY is affordable at 15 requests, and Latest is a rolling window where new
  # legislation appears first — a weekly cadence would let a week of it sit
  # unseen.
  #
  # 04:30, alone. lloc.gov.bh answers a burst of requests with a 1,245-byte IIS
  # 404 that parses as an empty page, so nothing else touching this host may run
  # near it. If the classification refresh is ever scheduled, it must not overlap.
  #
  # NOT ENABLED: no baseline in the library yet, and output/workbooks/lloc.xlsx
  # is still the pre-fix export that `check` rejects. Re-export, check, promote,
  # then turn this on.
  monitor_lloc:
    enabled: false
    trigger: cron
    schedule:
      hour: 4
      minute: 30

  # ----------------------------------------------------------
  # NO JOB FOR Saudi Exchange OR SIMAH — deliberately.
  #
  # Both hosts block us, and both blocks were caused by automated access from
  # this one address: saudiexchange.sa went from crawling cleanly at 18:27 to
  # Akamai 403 within two hours on 2026-08-15, and simah.com's note records its
  # Cloudflare block as "triggered by repeated iteration, not volume".
  #
  # A scheduled retry is therefore not a way out of either block — it is the
  # thing that made them, and it would deepen them. config/change_signals.yml
  # `skip_hosts` already stops a sweep touching the hosts; giving them no job
  # means nothing can schedule its way past that either.
  #
  # The `until` dates there are REVIEW dates, not expiries: a person retests by
  # hand and deletes the entry. Nothing unblocks itself.
  # ----------------------------------------------------------
