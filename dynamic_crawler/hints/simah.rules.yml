# SIMAH — Rules and Regulations. TWO documents, not one.
#
# This page is not a listing. It is one law rendered as 17 collapsible articles,
# with a second instrument offered as a PDF at the bottom:
#
#   1. Rules and Regulations                 <- the page itself, 17 articles of
#                                               law text (~8,000 characters)
#   2. The Implementing Regulations for      <- a PDF
#      Credit Information Law
#
# Both are captured now. The first version of this form took only the PDF and
# reported "1 document" — stable, 100% filled, and missing the actual law.
#
# MEASURED 2026-08-05, from the first successful capture (91 KB, 17 articles):
#   9,016 characters of law, articles 1-17, plus the PDF. Getting there needed
#   three fixes in runner.py that had nothing to do with this form:
#
#   * The page is SharePoint, so EVERYTHING sits inside <form id="aspnetForm">.
#     JS_DETAIL used to delete forms, which deleted the whole law (8,182 chars ->
#     0) and left a 444-character husk. Forms are unwrapped now, not removed.
#   * The accordion is EXCLUSIVE (data-bs-parent="#rulesAccordion"), so bootstrap
#     closes each panel when the next opens: clicking all 17 can never leave more
#     than one open, and expand_selector cannot fix that. Rendered text therefore
#     sees one article of seventeen. JS_DETAIL falls back to textContent for
#     exactly this case. DO NOT "fix" the expand selector — it is not the problem.
#   * #DeltaPlaceHolderMain (SharePoint's main-content placeholder) is now a
#     content candidate; without it the capture also carried the ribbon, "Sign In"
#     and the footer — 16,913 characters instead of 9,016.
#
# ACCESS: simah.com is behind a Cloudflare firewall rule. A headed browser with a
# persistent profile got through on 2026-08-05 where headless was blocked. Work
# from the snapshot (`run --snapshot`), and let the refresh clock decide when to
# ask again — see HANDOFF.md §12.
#
# TWO SETTINGS DO THE WORK
#
#   expand_selector: the articles are collapsed until clicked. Kept because it
#     makes the stored HTML closer to what a person sees, but the TEXT no longer
#     depends on it (see the exclusive-accordion note above).
#
#   include_page: the seed URL is itself a document, not just an index of other
#     documents. True of any regulation published as a single page.
#
# fetch_details must be true for include_page: the page's text and HTML are
# captured by phase 2, the same way any detail page is.

version: 1
name: simah.rules
seed_url: "https://www.simah.com/english/Pages/rules-and-regulations.aspx"
shape: list
scope: prefix

# Open every article before reading anything.
expand_selector: "button.accordion-button"

# The page itself is document #1.
include_page: true

# ONE ENTRY, WITH THE PDF ATTACHED.
#
# The page carries the Credit Information Law (17 articles) and, beneath it, a
# download block for its Implementing Regulations. Those were two rows: the Law
# with its text, and a second row holding a title, a .pdf url and NOTHING else —
# because that PDF lives on simah.com and allow_live is false, so it can never be
# fetched while the block stands. A permanent empty shell is not a document.
#
# `combined` matches how the manual library models this, and how SDAIA's
# "Personal Data Protection Law and The implementing Regulation" is already
# stored here: one instrument, its files in extra_meta["attachment_links"].
#
# If the manual library turns out to list SIMAH as two separate entries, this is
# the line to change back — that is ground truth and it beats the inference.
attachment_is_document: "combined"

# Document #2: the block holding the heading, the blurb and the download button.
row_selector: "div.accordion-sub-hd"

# The download block is duplicated: it is the ROW that becomes the attachment,
# and it also sits inside the page's own HTML, where it reads as if "click the
# below button to download the PDF file" were part of the Law's text. Strip it
# from the stored document; the file it points at is on the row already.
content:
  strip:
    - "div.accordion-sub-hd"
detail_link_selector: "a[href]"

pagination:
  mode: none
  max_pages: 1

fields:
  # The <h6>, not the button. "Download PDF" is not a document title.
  title:
    from: css
    selector: "h6"
    attr: text
  document_url:
    from: css
    selector: "a[href]"
    attr: href

section_path:
  # No prefix. The folder trail is  regulator > source_system > <here> > title,
  # and the source YAML already supplies the first two crumbs. Repeating either
  # of them here would create a duplicate folder.
  prefix: []

fetch_details: true
notes: "Page-as-document plus one attached PDF; accordions expanded before capture."

# Who this source belongs to. These two lead the folder trail AND the
# section_path column in the Excel, so the crawler's own output shows the
# same path the library will use. Defined here only — the pipeline reuses
# them rather than prepending its own copy.
library:
  # Full name, then the acronym — house style, and this is doc_path[0] and
  # therefore the root folder of SIMAH's tree. Changed 2026-08-14.
  regulator: "Saudi Credit Bureau (SIMAH)"
  source_system: "Rules and Regulations"
meta:
  approved: true
  approved_by: lead
  approved_at: '2026-08-13T17:06:15+00:00'
  form_hash: fd47a25b049c
  verify:
    verdict: WARN
    counts:
    - 2
    - 2
    - 2
    spread_pct: 0.0
    fill_rates:
      title: 100.0
      document_url: 100.0
    verified_at: '2026-08-13T17:06:15+00:00'
    source: snapshot
    forced: true
