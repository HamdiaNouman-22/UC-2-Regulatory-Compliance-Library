# ============================================================
# Regulatory Pipeline Scheduler Configuration
# ============================================================
# 
# This file controls when each regulator pipeline runs.
# Supports both direct execution and API-based triggering.
#
# Timezone: Set in .env file (default: Asia/Karachi)
# ============================================================

jobs:
  # --------------------------------------------------------
  # SBP Pipeline
  # --------------------------------------------------------
  sbp_pipeline:
    enabled: true
    trigger: cron
    schedule:
      # Run every day at 2:00 AM (Karachi time)
      hour: 2
      minute: 0
      # day_of_week: '*'  # Every day (default)
      # day_of_week: 'mon,wed,fri'  # Specific days
      # day_of_week: 'mon-fri'  # Weekdays only

  # --------------------------------------------------------
  # SECP Pipeline
  # --------------------------------------------------------
  secp_pipeline:
    enabled: true
    trigger: cron
    schedule:
      # Run every day at 3:00 AM (Karachi time)
      hour: 3
      minute: 0

  # --------------------------------------------------------
  # SAMA Pipeline
  # --------------------------------------------------------
  sama_pipeline:
    enabled: true
    trigger: cron
    schedule:
      # Run every day at 4:00 AM (Karachi time)
      hour: 10
      minute: 46

  # --------------------------------------------------------
  # CBB Monitoring
  # --------------------------------------------------------
  cbb_monitoring:
    enabled: true
    trigger: cron
    schedule:
      # Run every day at 5:00 AM (Karachi time)
      hour: 5
      minute: 0

  # --------------------------------------------------------
  # Full Pipeline (All Regulators)
  # --------------------------------------------------------
  # This is only available when using API mode
  # It triggers all regulators via a single API call
  full_pipeline:
    enabled: false  # Set to true if you want to use this instead
    trigger: cron
    schedule:
      # Run every day at 2:00 AM (Karachi time)
      hour: 2
      minute: 0

# ============================================================
# Schedule Examples
# ============================================================
#
# Daily at specific time:
#   hour: 14
#   minute: 30
#
# Weekdays only at 9 AM:
#   hour: 9
#   minute: 0
#   day_of_week: 'mon-fri'
#
# Specific days at 6 PM:
#   hour: 18
#   minute: 0
#   day_of_week: 'mon,wed,fri'
#
# Every 6 hours:
#   trigger: interval
#   schedule:
#     hours: 6
#
# Every Monday at 10 AM:
#   hour: 10
#   minute: 0
#   day_of_week: 'mon'
#
# Twice daily (8 AM and 8 PM):
#   Create two separate jobs with different hours
# ============================================================

  # ==========================================================
  # KSA MONITORING
  # ==========================================================
  # Grouped by what each regulator's site will actually answer, because that —
  # not the regulator's importance — decides how often and how expensively it
  # can be checked. The measurements behind each grouping are in
  # jobs/monitor_jobs.py and config/change_signals.yml.
  #
  # All four write STRAIGHT TO MSSQL and leave `status` EMPTY. "What arrived
  # overnight and nobody has judged" is `WHERE status = ''`; a person sets
  # active/reject through POST /update-status/regulations. Nothing here approves
  # its own output.
  #
  # DISABLED BY DEFAULT. Turning these on is a server decision, not a repo one.
  # ----------------------------------------------------------

  # MOE, MOH, SDAIA, AML, MHRSD, ZATCA — one request per stored document,
  # about a minute for all six. Crawls only what actually moved.
  monitor_cheap_probes:
    enabled: false
    trigger: cron
    schedule:
      hour: 3
      minute: 0

  # SAMA's own "what changed" page: ~3 seconds instead of 6,101 probes. This is
  # also the only signal that DISCOVERS documents missing from the library.
  monitor_sama:
    enabled: false
    trigger: cron
    schedule:
      hour: 3
      minute: 15

  # mc.gov.sa refuses plain HTTP clients, so no probe can answer and the crawl
  # IS the signal. ~16 minutes, so weekly rather than daily.
  monitor_mc:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 4
      minute: 0

  # CMA cannot be probed (its Last-Modified is the current time) and cannot be
  # confirmed at scale. Weekly, and the announcements tab MUST run as a recent
  # window — a full walk measured 2h49m and still returned 300 of the 1,053
  # announcements we hold, which would rule the other 753 `disappeared`.
  # CMA_SINCE_DAYS controls that window.
  monitor_cma:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 5
      minute: 0

  # MLCU (Egypt). No ETag, no Last-Modified, no sitemap lastmod, and its news
  # page carries neither dates nor document links — every cheaper signal was
  # measured and ruled out, so the crawl is the signal. Small: five section
  # pages plus 24 PDFs.
  #
  # DISABLED, AND FOR A SECOND REASON BEYOND THE ONE ABOVE. The other four are
  # off because turning them on is a server decision. This one is off because
  # MLCU IS NEW AND NOBODY HAS READ ITS WORKBOOK YET. A new regulator goes to a
  # workbook first; this path writes straight to MSSQL, so enabling it before
  # the review would make the first scheduled run be the ingest. Turn it on
  # after the workbook is approved and promoted, not before.
  #
  # Sunday 06:00 keeps it clear of monitor_mc (04:00) and monitor_cma (05:00) —
  # all three take the same `_run_exclusive` lock, and an overlap is a SKIP, so
  # a colliding slot would silently starve a job rather than fail.
  monitor_mlcu:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 6
      minute: 0

  # ----------------------------------------------------------
  # NO JOB FOR Saudi Exchange OR SIMAH — deliberately.
  #
  # Both hosts block us, and both blocks were caused by automated access from
  # this one address: saudiexchange.sa went from crawling cleanly at 18:27 to
  # Akamai 403 within two hours on 2026-08-15, and simah.com's note records its
  # Cloudflare block as "triggered by repeated iteration, not volume".
  #
  # A scheduled retry is therefore not a way out of either block — it is the
  # thing that made them, and it would deepen them. config/change_signals.yml
  # `skip_hosts` already stops a sweep touching the hosts; giving them no job
  # means nothing can schedule its way past that either.
  #
  # The `until` dates there are REVIEW dates, not expiries: a person retests by
  # hand and deletes the entry. Nothing unblocks itself.
  # ----------------------------------------------------------
