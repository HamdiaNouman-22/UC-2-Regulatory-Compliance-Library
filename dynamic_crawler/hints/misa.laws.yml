version: 1
name: misa.laws
seed_url: https://misa.gov.sa/activities/laws/
shape: list
scope: prefix
row_selector: div.showLawItems a.showLawDocItem
detail_link_selector: a.showLawDocItem
pagination:
  mode: none
  max_pages: 1
fields:
  title:
    from: css
    selector: span.showLawTitle
    attr: text
  document_url:
    from: css
    selector: a.showLawDocItem
    attr: href
section_path:
  # No prefix. The folder trail is  regulator > source_system > <here> > title,
  # and the source YAML already supplies the first two crumbs. Repeating either
  # of them here would create a duplicate folder.
  prefix: []
  levels:
  - ancestor: div.regulationContent
    title: h4
  - ancestor: div.showLawItems
    title: h4
fetch_details: false
notes: Unsure if the row_selector scoped to div.showLawItems will capture all laws
  on all possible page variations.
# Who this source belongs to. These two lead the folder trail AND the
# section_path column in the Excel, so the crawler's own output shows the
# same path the library will use. Defined here only — the pipeline reuses
# them rather than prepending its own copy.
library:
  regulator: "MISA"
  source_system: "Laws and Regulations"
meta:
  proposed_by: default (see llm_client.DEFAULT_MODEL)
  proposed_at: '2026-08-02T10:29:35+00:00'
  instruction: ''
