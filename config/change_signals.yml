# What each source's version signal is worth, and what it costs to read.
# Every setting here is a measurement, and the measurement is the comment.
#
#   identity  the fields that decide "the same document", when the stored rows do
#             not already carry the source's own choice in extra_meta
#   confirm   fetch the document and hash its bytes before calling it modified.
#             Only for a regulator whose version counters move in bulk.
#   workers   parallel probes. Not a throughput knob -- see
#             dynamic_crawler/fingerprint.py for why the number is 4.
#   timeout   seconds per probe. A probe measured 21s against one regulator.

defaults:
  identity: [document_url, doc_path]
  confirm: false
  workers: 4
  timeout: 20

# Hosts no sweep may touch, whatever url a stored row happens to hold. A sweep
# walks the library rather than a site, so without this it will probe a host we
# are not allowed on because some stored row still points there.
#
# `until` is when the block may be REVIEWED, not when it expires. Nothing here
# unblocks itself on a date -- a person deletes the entry.
skip_hosts:
  - host: simah.com
    until: "2026-09-04"
    why: >-
      Cloudflare 1020-class block, not a challenge -- there is nothing to solve.
      It was triggered by repeated iteration, not volume. Work from
      output/snapshots/simah.rules.html, and take the one permitted probe inside
      the next scheduled capture.

# source_system is NOT unique across regulators: AML and SIMAH both publish under
# "Rules and Regulations", SDAIA and MISA both under "Laws and Regulations". Both
# halves of the pair are required to name a source.
sources:
  - regulator: "SDAIA"
    source_system: "Laws and Regulations"
    # 36/36 documents returned an ETag, counters 1-4 across 18 distinct
    # timestamps: a real per-document edit history, so the counter is proof.
    confirm: false

  - regulator: "Anti-Money Laundering Permanent Committee"
    source_system: "Rules and Regulations"
    # 8/8 documents at version 5, every timestamp inside a three-second window:
    # one bulk re-upload of the whole library, not eight edits. The next one
    # moves every counter at once, so the counter alone is not evidence here.
    confirm: true

  - regulator: "Ministry of Education"
    source_system: "Systems, Regulations and Policies"
    # JavaScript-rendered: no listing an HTTP client can read, so the stored urls
    # are the only inventory there is. Detection works, discovery still needs the
    # browser crawl.
    confirm: false

  # GOSI is read by --signal gosi, not by the stored-inventory sweep: its CMS
  # returns the whole page, so the source is the SEED PAGE and `source_system`
  # here is GOSI's own `siteUrl`. `confirm` is structural on that path and is not
  # read from this file -- one page date is shared by every instrument on the
  # page, so a content hash always decides.
  #
  # The two GOSI forms declare no regulator or source_system yet. When they do,
  # reconcile the name they store with these two, or the sweep and the ingest
  # path will keep separate memories of the same page.
  - regulator: "GOSI"
    source_system: "SocialInsurance"
    # 6 instruments, 45 sections, 6 PDFs on cmsgosi.gosi.gov.sa whose ETag
    # counters read 22, 12, 3, 3, 3, 3 -- a real per-document history, unlike the
    # single page date all six instruments share.
    workers: 4
    timeout: 20

  # MHRSD is read by --signal sitemap. The form declares no regulator or
  # source_system either, so the source is named for the form; reconcile it with
  # whatever a library: block later stores, or the sweep and the ingest path
  # will keep separate memories of the same 63 documents.
  - regulator: "MHRSD"
    source_system: "mhrsd.regs"
    # Measured 2026-08-10 on sitemap.xml?page=7: 1000 urls, 62 of the 63 we
    # track. Over those 62 -- 37 distinct lastmod, and 26 still sharing
    # 2025-05-14, one CMS operation rather than 26 amendments. So the date
    # shortlists and the page hash decides; `confirm` is structural on this path
    # and is not read from this file.
    #
    # The 63rd document is stored at a /en/ node-id url that 308-redirects to an
    # /en/ Arabic slug returning 404. It is not withdrawn -- the same slug
    # WITHOUT /en/ is live and is in the sitemap. Our stored url is dead, which
    # is a library problem, not a sweep one: the sweep reports it and stops.
    sitemap: "https://www.hrsd.gov.sa/sitemap.xml?page=7"
    timeout: 30
    # 68-92% of a detail page's text is an eight-card "related regulations"
    # view, so a whole-page hash moves whenever the ministry publishes anything.
    # The confirm hash stops here.
    cut_marker: "block-views-block-regulations-and-procedures-related"

  - regulator: "GOSI"
    source_system: "Saned"
    # 2 instruments, 51 sections, and no document links at all: the page text is
    # the whole of it, so here the page date is the only signal there is.
    workers: 4
    timeout: 20

# Not listed, deliberately:
#   CMA     its counters (2-5 across four distinct months) earn confirm: false,
#           but it runs through site_runners/cma_laws.py and its stored
#           source_system is unverified from here. It takes `defaults` until
#           someone reads the real value off the library.
#   MOH x2  same shape as MOE; both forms are still approved=false.
